<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script defer src="assets/js/home.js"></script>
        <link rel="stylesheet" href="assets/css/scorecard.css">
        <style>
            main { padding-bottom: 1rem; }
            form { display: flex; flex-direction: column; gap: 0.5rem; width: min(20rem, 90vw); }
            label { font-size: 1.1rem; }
            select, input { font-size: 1.3rem; padding: 0.5rem; }
            #status { min-height: 1.5rem; text-align: center; margin: 1rem; color: red; }
        </style>

        <title>Arrowscore</title>
    </head>
    <body>
        <main>
            <h1>Arrowscore</h1>

            <form id="join-form">
                <label for="member">Your name</label>
                <select id="member" required disabled>
                    <option value="">Loading names...</option>
                </select>

                <label for="event-code">Event code</label>
                <input id="event-code" type="text" placeholder="Enter event code"
                       autocomplete="off" autocapitalize="off" required>

                <button type="submit">Join</button>
            </form>

            <p id="status" role="status"></p>
        </main>
    </body>
</html>
