<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <script defer src="assets/js/score.js"></script>
        <link rel="stylesheet" href="assets/css/scorecard.css">

        <title>Arrowscore</title>
    </head>
    <body>
        <main>
            <h1>Test Scorecard</h1>
            <div><p>Event code: </p><input id="event-code" type="text" placeholder="Enter event code"></div>
            <table id="scorecard">
                <tr>
                    <th id="end-header" class="end-label">End</th>
                    <th colspan="5">Arrows</th>
                </tr>
                <!-- <tr id="end-total-row">
                    <th colspan="4" id="end-total-label">End Total: </th>
                    <th colspan="2" id="end-total-value"></th>
                </tr> -->
                <tr id="running-total-row">
                    <th colspan="4">Running Total: </th>
                    <th colspan="2" id="running-total-value"></th>
                </tr>
            </table>
            
            <button id="submit-scorecard-button">Submit Scorecard</button>
            <p id="submit-message"></p>
            <div id="keypad" role="group" aria-label="Score keypad">
                <button type="button" class="key" data-token="M" aria-label="Miss">M</button>
                <button type="button" class="key" data-token="1">1</button>
                <button type="button" class="key" data-token="2">2</button>
                <button type="button" class="key" data-token="3">3</button>
                <button type="button" class="key" data-token="4">4</button>
                <button type="button" class="key" data-token="5">5</button>
                <button type="button" class="key" data-token="6">6</button>
                <button type="button" class="key" data-token="7">7</button>
                <button type="button" class="key" data-token="8">8</button>
                <button type="button" class="key" data-token="9">9</button>
                <button type="button" class="key" data-token="10">10</button>
                <button type="button" class="key" data-token="X" aria-label="Inner ten">X</button>
                <button type="button" class="key wide" data-action="back" aria-label="Delete">⌫</button>
            </div>
        </main>    
    </body>
</html>
